# Имя должно совпадать с именем воркера в Cloudflare (у вас было sp)
name = "sp"
main = "worker.js"
compatibility_date = "2025-01-01"

# Встроенный ИИ Cloudflare (бесплатный лимит, ключи не нужны)
[ai]
binding = "AI"

# Посты 4 раза в день. Время в UTC: 06, 10, 14, 18 = 09, 13, 17, 21 по Москве
[triggers]
crons = ["0 6,10,14,18 * * *"]

# НЕОБЯЗАТЕЛЬНО (рекомендуется): KV для лимита ответов и защиты от повторных постов.
# 1) Cloudflare → Storage & Databases → KV → Create namespace
# 2) Скопируйте ID, вставьте ниже и уберите «#» в начале трёх строк
# [[kv_namespaces]]
# binding = "KV"
# id = "ВСТАВЬТЕ_ID_СЮДА"
