# Имя должно совпадать с именем воркера в Cloudflare (у вас было sp)
name = "sp"
main = "worker.js"
compatibility_date = "2025-01-01"

# Встроенный ИИ Cloudflare (бесплатный лимит, ключи не нужны)
[ai]
binding = "AI"

# Расписание (время в UTC):
#   "0 6,10,14 * * *" — обычные посты в 09:00, 13:00, 17:00 по Москве
#   "0 17 * * *"      — мини-серия в 20:00 по Москве
# Если меняете вторую строку, поменяйте SCENARIO_CRON в worker.js на то же значение.
[triggers]
crons = ["0 6,10,14 * * *", "0 17 * * *"]

# НЕОБЯЗАТЕЛЬНО, но нужно для отсылок в мини-сериях и точных лимитов:
# 1) Cloudflare → Storage & Databases → KV → Create namespace
# 2) Скопируйте ID, вставьте ниже и уберите «#» в начале трёх строк
# [[kv_namespaces]]
# binding = "KV"
# id = "ВСТАВЬТЕ_ID_СЮДА"
